[package]
name = "api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An axum service for company fundamentals."
repository = "https://github.com/ironcapitaleu/arkad"
categories = ["web-programming::http-server"]
keywords = ["api", "axum", "http", "fundamentals"]
readme = "../README.md"

[dependencies]
async-trait = "0.1.88"
# Every default feature except `tower-log`. It turns on the `log` feature of `tracing` for the whole
# workspace, which makes every `tracing` macro of `sec` count as more complex for clippy.
axum = { version = "0.8.9", default-features = false, features = [
    "form",
    "http1",
    "json",
    "matched-path",
    "original-uri",
    "query",
    "tokio",
    "tracing",
] }
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
getrandom = "0.4"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
storage = { version = "0.1.0", path = "../storage" }
thiserror = "2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
utoipa = "6"
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1.23.2", features = ["v7"] }
xbrl = { version = "0.1.0", path = "../xbrl" }

[features]
test-fixtures = []

[dev-dependencies]
# The integration tests use the fixtures of `api`. Only this feature exposes them outside of
# `cfg(test)`.
api = { path = ".", features = ["test-fixtures"] }
aws-lc-rs = "1"
base64 = "0.23"
# The PEM parser turns the PKCS#8 RSA test keys of `aws-lc-rs` into the PKCS#1 form that the signer
# takes. Only the tests sign tokens.
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs", "use_pem"] }
http-body-util = "0.1"
pretty_assertions = "1"
# Paused time lets the tests of the key refresh skip ahead without waiting.
tokio = { version = "1.52.3", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lib]
name = "api"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo = "deny"
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

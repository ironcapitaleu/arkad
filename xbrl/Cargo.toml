[package]
name = "xbrl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "XBRL domain logic: parsing, concept resolution, and financial statement validation."
repository = "https://github.com/ironcapitaleu/arkad"
categories = ["finance", "parser-implementations"]
keywords = ["xbrl", "sec", "financial-data", "parsing"]
readme = "../README.md"

[dependencies]
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
roxmltree = "0.21"
sha2 = "0.11.1"

[features]
# Exposes `xbrl::tests` outside of `cfg(test)`, so the integration tests can use its fixtures.
test-fixtures = []
# The generator of the US GAAP tables. A developer runs it once per release, and no normal build
# needs it.
generator = []

[[bin]]
name = "generate_us_gaap"
path = "src/bin/generate_us_gaap.rs"
required-features = ["generator"]

[dev-dependencies]
pretty_assertions = "1"
# The self dev-dependency turns on `test-fixtures` and `generator` for every test build, so CI runs
# the fixture-based and the generator tests.
xbrl = { path = ".", features = ["generator", "test-fixtures"] }

[lib]
name = "xbrl"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo = "deny"
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

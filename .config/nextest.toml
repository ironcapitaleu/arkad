# Settings of `cargo nextest` for every crate of the workspace. CI runs `cargo test`, so these
# settings apply to local runs only.

[profile.default]
# Nextest marks a test as leaky if its output stays open longer than this period after its process
# exits. On a loaded machine, the output can close later than the default of 100 ms. A child
# process that outlives its test keeps the output open for longer, and still shows as a leak.
leak-timeout = "1s"

[package]
name = "storage_filesystem"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Filesystem adapter for the storage persistence traits."
repository = "https://github.com/ironcapitaleu/arkad"
categories = ["database-implementations", "filesystem"]
keywords = ["storage", "filesystem", "repository", "adapter"]
readme = "../README.md"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
storage = { path = "../storage" }
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1.0"

[lib]
name = "storage_filesystem"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo = "deny"
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

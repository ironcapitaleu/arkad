name: Container CI

on:
  push:
    branches: 
      - main
      - master
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container_ci.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Environment Variables
        run: |
          # Downcase the repository name and set it as an environment variable
          echo "repository_name=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      - name: Display Execution Context
        run: |
          echo "::group::Execution Context"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Event: ${{ github.event_name }}"
          echo "Username for Container Registry login : ${{ github.actor }}"
          echo "Repository Name (raw): ${{ github.repository }}"
          echo "Repository Name (lowercased): ${{ env.repository_name }}"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The second build reuses the cached build stage, so the binaries compile once.
      - name: Build Images
        run: |
          docker build --load --target backfill -t arkad-backfill .
          docker build --load --target daily-filings -t arkad-daily-filings .

      # The images have no shell, so the check reads the image config and the exported file system.
      # Each image must run as uid and gid 10001, `/etc/passwd` and `/etc/group` must name `arkad`
      # for 10001 with the home `/home/arkad`, user 10001 must own `/home/arkad`, and
      # `/usr/local/bin` must hold only the binary of the image, which is also its entrypoint.
      - name: Check Images
        run: |
          failed=0
          check() {
            local name="$1" expected="$2" result="$3"
            if [ "$result" != "$expected" ]; then
              echo "::error::$name: expected '$expected', got '$result'"
              failed=1
            fi
          }
          for pair in arkad-backfill:backfill arkad-daily-filings:daily_filings; do
            image="${pair%%:*}"
            binary="${pair#*:}"
            check "$image user" "10001:10001" "$(docker image inspect --format '{{.Config.User}}' "$image")"
            check "$image entrypoint" "[/usr/local/bin/$binary]" "$(docker image inspect --format '{{.Config.Entrypoint}}' "$image")"
            container="$(docker create "$image")"
            root="$(mktemp -d)"
            docker export "$container" | tar -xf - -C "$root" etc/passwd etc/group
            listing="$(docker export "$container" | tar --numeric-owner -tvf -)"
            docker rm "$container" > /dev/null
            check "$image passwd entry of 10001" "arkad:x:10001:10001:arkad:/home/arkad:/sbin/nologin" "$(awk -F: '$3 == "10001"' "$root/etc/passwd")"
            check "$image group entry of 10001" "arkad:x:10001:" "$(awk -F: '$3 == "10001"' "$root/etc/group")"
            check "$image owner of /home/arkad" "10001/10001" "$(echo "$listing" | awk '$6 == "home/arkad/" { print $2 }')"
            check "$image files in /usr/local/bin" "usr/local/bin/$binary" "$(echo "$listing" | awk '$6 ~ "^usr/local/bin/." { print $6 }')"
          done
          exit "$failed"

      # Each binary must start on the static base. A dynamic binary fails there before its first log.
      # `daily_filings` without ARKAD_FROM stops at startup. `backfill` gets no network. Before its
      # first state, it asks the SEC which Notes quarters exist, and that request fails and retries.
      # So the check needs a JSON log event from `backfill` and a container that still runs.
      - name: Check Startup
        run: |
          failed=0
          daily_filings_log="$(docker run --rm arkad-daily-filings 2>&1 || true)"
          if ! echo "$daily_filings_log" | grep -q '\[MissingStartDate\]'; then
            echo "::error::arkad-daily-filings did not stop with MissingStartDate: $daily_filings_log"
            failed=1
          fi
          container="$(docker run --detach --network none arkad-backfill)"
          sleep 5
          backfill_log="$(docker logs "$container" 2>&1)"
          backfill_running="$(docker inspect --format '{{.State.Running}}' "$container")"
          docker rm --force "$container" > /dev/null
          if ! echo "$backfill_log" | grep -q '"event":"'; then
            echo "::error::arkad-backfill wrote no log event: $backfill_log"
            failed=1
          fi
          if [ "$backfill_running" != "true" ]; then
            echo "::error::arkad-backfill stopped within 5 seconds: $backfill_log"
            failed=1
          fi
          exit "$failed"


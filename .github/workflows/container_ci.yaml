name: Container CI

on:
  push:
    branches: 
      - main
      - master
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container_ci.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Environment Variables
        run: |
          # Downcase the repository name and set it as an environment variable
          echo "repository_name=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      - name: Display Execution Context
        run: |
          echo "::group::Execution Context"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Event: ${{ github.event_name }}"
          echo "Username for Container Registry login : ${{ github.actor }}"
          echo "Repository Name (raw): ${{ github.repository }}"
          echo "Repository Name (lowercased): ${{ env.repository_name }}"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: docker build --load -t arkad-extract .

      # The image must run as uid and gid 10001, and the `arkad` group must own gid 10001.
      - name: Check Image User
        run: |
          expected="10001 10001 10001:10001 arkad"
          result="$(docker run --rm --entrypoint sh arkad-extract -c 'echo "$(id -u) $(id -g) $(stat -c %u:%g /home/arkad) $(getent group 10001 | cut -d: -f1)"')"
          if [ "$result" != "$expected" ]; then
            echo "::error::Expected '$expected', got '$result'"
            exit 1
          fi


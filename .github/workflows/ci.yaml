name: CI

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays at midnight

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: 'always'

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7
    - name: Read the Rust Version
      id: toolchain
      run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - name: Rust Version Check
      run: grep -q "^FROM .* rust:${{ steps.toolchain.outputs.version }}-trixie AS build$" Dockerfile
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Code Formatting Check
      run: cargo fmt --check
    - name: Security Check
      run: cargo audit
    - name: Code Compilation Check
      run: cargo check
    - name: Documentation Check
      run: cargo doc --no-deps --document-private-items --workspace
      env:
        RUSTDOCFLAGS: "-D warnings"
    - name: Linting
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Unit Tests
      run: cargo test --lib
    - name: Documentation Tests
      run: cargo test --doc

  integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7
    - name: Read the Rust Version
      id: toolchain
      run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
    - uses: Swatinem/rust-cache@v2
    - name: Integration Tests
      run: cargo test --test '*'

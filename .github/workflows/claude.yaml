name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    # `opened` alone leaves no recovery path. PR #198 opened with no workflow
    # run of any kind. PR #199 opened the same way and fired every check, so
    # the cause is unconfirmed. `reopened` lets a human fire the review by hand.
    # `synchronize` is absent, because it reviews every push. See `pr-iterate`
    # for the `@claude review` recovery path.
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Model used by both Claude jobs. Defined once so the two jobs cannot drift.
  CLAUDE_MODEL: claude-opus-5

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"

  claude-auto-review:
    # Test the PR author, not `github.actor`. On a `reopened` event
    # `github.actor` is whoever reopened the PR, so an actor test lets a human
    # reopen of a dependabot PR through.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are an adversarial code reviewer for this pull request.

            Apply the "PR Review Guidelines" section of AGENTS.md exactly.

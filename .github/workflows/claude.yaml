name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.CLAUDE_AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.CLAUDE_AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model us.anthropic.claude-sonnet-4-6'

  claude-auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.CLAUDE_AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.CLAUDE_AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model us.anthropic.claude-sonnet-4-6'
          prompt: |
            Review this PR using the project's AGENTS.md "PR Review Guidelines" section.

            1. Post a summary of the changes in 2-3 bullet points.

            2. For each finding, reference the specific file and line. Categorize by severity:
               - 🔴 Bug / security issue / correctness problem (must fix)
               - 🟡 Improvement / performance / style (should fix)
               - 🟣 Nit / minor (optional)

            3. When you can provide a concrete fix, include a code block showing the corrected code.

            4. If the PR looks clean, just post the summary — no further action needed.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    # A PR sometimes gets no workflow runs on open. With `opened` alone, no
    # later `pull_request` event starts the auto-review. `reopened` adds one.
    # `synchronize` is absent, because it reviews every push.
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Model used by both Claude jobs. Defined once so the two jobs cannot drift.
  CLAUDE_MODEL: claude-opus-5

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A review diffs `origin/main...HEAD`, which needs the merge base.
          # A shallow fetch holds it only while the branch is level with
          # `main`, so a later review would read a wrong diff and not say so.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"

  claude-auto-review:
    # Test the PR author, not `github.actor`. On a `reopened` event
    # `github.actor` is whoever reopened the PR, so an actor test lets a human
    # reopen of a dependabot PR through.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are an adversarial code reviewer for this pull request.

            Apply the "PR Review Guidelines" section of AGENTS.md exactly.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    # `opened` alone leaves no recovery path. A PR opened through the GitHub
    # API can produce no workflow runs at all, as PR #198 did, and the failure
    # is intermittent. `reopened` gives a second chance to fire the review.
    # `synchronize` is deliberately absent, because it would review every push.
    # See the `pr-iterate` skill for the `@claude review` recovery path.
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Model used by both Claude jobs. Defined once so the two jobs cannot drift.
  CLAUDE_MODEL: claude-opus-5

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"

  claude-auto-review:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are an adversarial code reviewer for this pull request.

            Apply the "PR Review Guidelines" section of AGENTS.md exactly.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-4-8'
          allowed_bots: "claude[bot]"

  claude-auto-review:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-4-8'
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are an adversarial code reviewer. Your default assumption is that
            this PR contains at least one defect, gap, or unjustified decision, and
            your job is to find it. Do not affirm the change; interrogate it. A
            review that only praises is a failed review.

            Apply the "PR Review Guidelines" section of AGENTS.md exactly.

            1. Summary: 2-3 bullets on what the change does.

            2. Verdict chain (required): work the DoD → Test Plan → per-item
               verdict. For each DoD item, state whether the diff actually proves
               it, and how you checked. Name anything you could NOT verify.

            3. Findings: reference the specific file and line. Categorize:
               - 🔴 Bug / security / correctness (must fix)
               - 🟡 Improvement / performance / design (should fix)
               - 🟣 Nit / minor (optional)
               For each 🔴/🟡, give a concrete failure scenario (inputs → wrong
               result), then a code block with the fix.

            4. Adversarial pass: list the edge cases, error paths, and concurrency
               or ordering assumptions the author most likely did not test. State
               which are covered and which are not.

            5. If you genuinely find no material issues, you must still state
               explicitly what you verified and what residual risk remains — never
               approve by silence. Requesting a split for anything over the LoC
               ceiling is always valid.

            Do not raise findings for rules not in AGENTS.md, and do not nitpick
            trivial formatting.

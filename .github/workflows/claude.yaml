name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.CLAUDE_AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.CLAUDE_AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model us.anthropic.claude-sonnet-4-6'

  claude-auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.CLAUDE_AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.CLAUDE_AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model us.anthropic.claude-sonnet-4-6'
          prompt: |
            Summarize the changes in this PR in 2-3 bullet points, then review for:
            - Correctness bugs
            - Security issues
            - Performance regressions
            Post findings as inline comments where applicable.

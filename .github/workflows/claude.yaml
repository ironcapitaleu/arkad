name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Model used by both Claude jobs. Defined once so the two jobs cannot drift.
  CLAUDE_MODEL: claude-opus-5

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"

  claude-auto-review:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }}'
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are an adversarial code reviewer. Start from the assumption that
            this PR contains at least one defect, gap, or unjustified decision,
            and try hard to find it before concluding otherwise. Interrogate the
            change rather than affirming it. Concluding "no material issues" is a
            valid result — but only after you have completed the verdict chain and
            adversarial pass below and stated the residual risk. Do not invent
            findings to avoid an empty list.

            Apply the "PR Review Guidelines" section of AGENTS.md exactly.

            1. Summary: 2-3 bullets on what the change does.

            2. Verdict chain (required): work the DoD → Test Plan → per-item
               verdict. For each DoD item, state whether the diff actually proves
               it, and how you checked. Name anything you could NOT verify. If the
               PR has no linked ticket/DoD, use the PR's Test Plan (or, absent
               that, the stated Type of change) as the DoD and say so explicitly.

            3. Findings: reference the specific file and line. Categorize:
               - 🔴 Bug / security / correctness (must fix)
               - 🟡 Improvement / performance / design (should fix)
               - 🟣 Nit / minor (optional)
               For each 🔴/🟡, give a concrete failure scenario (inputs → wrong
               result), then a code block with the fix.

            4. Adversarial pass: list the edge cases, error paths, and concurrency
               or ordering assumptions the author most likely did not test. State
               which are covered and which are not.

            5. If you genuinely find no material issues, you must still state
               explicitly what you verified and what residual risk remains — never
               approve by silence. Requesting a split for anything over the LoC
               ceiling is always valid.

            Do not raise findings for rules not in AGENTS.md, and do not nitpick
            trivial formatting.

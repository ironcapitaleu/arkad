[package]
name = "storage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Persistence layer: the backend-agnostic Repository traits, their error types, and the backends that implement them."
repository = "https://github.com/ironcapital/state_machine"
categories = ["database", "filesystem", "rust-patterns"]
keywords = ["storage", "repository", "persistence", "filesystem"]
readme = "../README.md"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["rt", "macros"] }

[lib]
name = "storage"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo = "deny"
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
